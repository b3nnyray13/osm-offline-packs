name: Daily vehicle restrictions

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { iso: AL, extract: europe/albania }
          - { iso: AD, extract: europe/andorra }
          - { iso: AT, extract: europe/austria }
          - { iso: BY, extract: europe/belarus }
          - { iso: BE, extract: europe/belgium }
          - { iso: BA, extract: europe/bosnia-herzegovina }
          - { iso: BG, extract: europe/bulgaria }
          - { iso: HR, extract: europe/croatia }
          - { iso: CY, extract: europe/cyprus }
          - { iso: CZ, extract: europe/czech-republic }
          - { iso: DK, extract: europe/denmark }
          - { iso: EE, extract: europe/estonia }
          - { iso: FI, extract: europe/finland }
          - { iso: FR, extract: europe/france }
          - { iso: DE, extract: europe/germany }
          - { iso: GB, extract: europe/great-britain }
          - { iso: GR, extract: europe/greece }
          - { iso: HU, extract: europe/hungary }
          - { iso: IS, extract: europe/iceland }
          - { iso: IE, extract: europe/ireland-and-northern-ireland }
          - { iso: IT, extract: europe/italy }
          - { iso: XK, extract: europe/kosovo }
          - { iso: LV, extract: europe/latvia }
          - { iso: LI, extract: europe/liechtenstein }
          - { iso: LT, extract: europe/lithuania }
          - { iso: LU, extract: europe/luxembourg }
          - { iso: MK, extract: europe/macedonia }
          - { iso: MT, extract: europe/malta }
          - { iso: MD, extract: europe/moldova }
          - { iso: MC, extract: europe/monaco }
          - { iso: ME, extract: europe/montenegro }
          - { iso: NL, extract: europe/netherlands }
          - { iso: "NO", extract: europe/norway }
          - { iso: PL, extract: europe/poland }
          - { iso: PT, extract: europe/portugal }
          - { iso: RO, extract: europe/romania }
          - { iso: RS, extract: europe/serbia }
          - { iso: SK, extract: europe/slovakia }
          - { iso: SI, extract: europe/slovenia }
          - { iso: ES, extract: europe/spain }
          - { iso: SE, extract: europe/sweden }
          - { iso: CH, extract: europe/switzerland }
          - { iso: TR, extract: europe/turkey }
          - { iso: UA, extract: europe/ukraine }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Download the OpenStreetMap extract
        # Geofabrik, with openstreetmap.fr as backup.
        run: curl -fsSL --retry 5 --retry-delay 20 -o country.osm.pbf "https://download.geofabrik.de/${{ matrix.extract }}-latest.osm.pbf" || curl -fsSL --retry 5 --retry-delay 20 -o country.osm.pbf "https://download.openstreetmap.fr/extracts/${{ matrix.extract }}-latest.osm.pbf"
      - name: Build
        run: |
          pip install osmium
          python scripts/build_restriction_pack.py country.osm.pbf ${{ matrix.iso }} out
          rm country.osm.pbf
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=restrictions-${{ matrix.iso }}
          # GitHub sometimes answers 5xx on large uploads (Ukraine, 03.11.2026): try again rather than lose the country for a day.
          for i in 1 2 3 4 5; do
            { gh release view $tag >/dev/null 2>&1 || gh release create $tag --title "Vehicle restrictions ${{ matrix.iso }}" --notes "Vehicle restriction tiles from OpenStreetMap (Geofabrik extract), rebuilt every day. © OpenStreetMap contributors, ODbL 1.0."; } &&
              gh release upload $tag out/${{ matrix.iso }}-restrictions.zip --clobber && exit 0
            sleep $((i * 30))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.iso }}
          path: out/${{ matrix.iso }}-restrictions.receipt.json
          retention-days: 3

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: receipts
          merge-multiple: true
      - name: Update catalog
        run: |
          python scripts/update_catalog.py receipts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "Vehicle restrictions $(date -u +%F)"
          # Several workflows write the catalog: rebase on the newest one and retry instead of queueing them.
          for i in 1 2 3 4 5; do git push && break; sleep $((i * 15)); git pull --rebase; done
