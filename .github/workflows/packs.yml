name: Offline packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Pack ids from regions.json, comma separated, or all"
        default: "DE-NO,DE-OS,DE-WE,DE-SU,BE,NL"
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          want="${{ github.event.inputs.packs || 'all' }}"
          if [ "$want" = all ]; then m=$(jq -c . regions.json)
          else m=$(jq -c --arg w "$want" '($w | split(",")) as $ids | map(select(.id as $i | $ids | index($i)))' regions.json); fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install pyvalhalla==3.6.3
          curl -fsSL --retry 5 -o work/planetiler.jar --create-dirs https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
      - name: Build
        id: build
        env:
          PACK_TITLE: ${{ matrix.title }}
        run: python scripts/build_offline_pack.py ${{ matrix.id }} work ${{ matrix.extracts }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.build.outputs.tag }}
          gh release view $tag >/dev/null 2>&1 || gh release create $tag --title "${{ matrix.title }} ${tag#${{ matrix.id }}-}" --notes "Offline map, routing, address search and POIs from OpenStreetMap (Geofabrik). © OpenStreetMap contributors, ODbL 1.0."
          gh release upload $tag work/dist/* --clobber
          mkdir -p receipt && cp work/entry.json receipt/${{ matrix.id }}.entry.json
      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.id }}
          path: receipt/${{ matrix.id }}.entry.json
          retention-days: 3

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: catalog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: receipts
          merge-multiple: true
      - name: Update catalog
        run: |
          git pull --rebase
          python scripts/update_catalog.py receipts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Offline packs $(date -u +%F)" && git push)
