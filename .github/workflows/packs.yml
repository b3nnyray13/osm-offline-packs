name: Offline packs

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Pack ids from regions.json, comma separated, all, or missing"
        default: "DE-NO,DE-OS,DE-WE,DE-SU,BE,NL"
  push:
    branches: [main]
    paths: [regions.json]
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          want="${{ github.event.inputs.packs || 'all' }}"
          # A changed regions.json builds only the packs not yet in the catalog.
          if [ "${{ github.event_name }}" = push ] || [ "$want" = missing ]; then m=$(jq -c --slurpfile c catalog.json 'map(select(.id as $i | $c[0].countries | has($i) | not))' regions.json)
          elif [ "$want" = all ]; then m=$(jq -c . regions.json)
          else m=$(jq -c --arg w "$want" '($w | split(",")) as $ids | map(select(.id as $i | $ids | index($i)))' regions.json); fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  # Planetiler's water, Natural Earth and lake data: downloaded once with retries, shared by every pack through the cache
  # (42 parallel downloads of 1 GB timed out on the first run).
  sources:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: sources
          key: planetiler-sources-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sources && cd sources
          # Each file from its source, with a copy in this repository as backup (osmdata.openstreetmap.de was down on 03.11.2026).
          base=https://github.com/${{ github.repository }}/releases/download/planetiler-sources
          get() { curl -fL --retry 5 --retry-delay 20 -o "$1" "$2" || curl -fL --retry 5 --retry-delay 30 -o "$1" "$base/$1"; }
          # Water: the original, else this repository's copy in 20 MB parts, joined and checked against its SHA-256.
          curl -fL --retry 3 --retry-delay 30 --connect-timeout 60 -o water-polygons-split-3857.zip https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip || {
            rm -f water-polygons-split-3857.zip; want=$(curl -fsL "$base/water-polygons-split-3857.zip.sha256")
            for n in $(seq -w 0 59); do curl -fsL --retry 5 -o part$n "$base/water-polygons-split-3857.zip.part$n" || break; done
            cat part* > water-polygons-split-3857.zip && rm part*
            [ "$(sha256sum water-polygons-split-3857.zip | cut -d' ' -f1)" = "$want" ]; }
          get natural_earth_vector.sqlite.zip https://naciscdn.org/naturalearth/packages/natural_earth_vector.sqlite.zip
          get lake_centerline.shp.zip https://github.com/acalcutt/osm-lakelines/releases/download/v12/lake_centerline.shp.zip
          ls -la

  build:
    needs: [prepare, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* /opt/microsoft /opt/google /usr/lib/jvm/temurin-8* /usr/lib/jvm/temurin-11*; sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install pyvalhalla==3.6.3
          curl -fsSL --retry 5 -o work/planetiler.jar --create-dirs https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
      - uses: actions/cache/restore@v4
        with:
          path: sources
          key: planetiler-sources-v1
          fail-on-cache-miss: true
      - name: Build
        id: build
        env:
          PACK_TITLE: ${{ matrix.title }}
        run: mkdir -p work/data && mv sources work/data/sources && python scripts/build_offline_pack.py ${{ matrix.id }} work ${{ matrix.extracts }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.build.outputs.tag }}
          gh release view $tag >/dev/null 2>&1 || gh release create $tag --title "${{ matrix.title }} ${tag#${{ matrix.id }}-}" --notes "Offline map, routing, address search and POIs from OpenStreetMap (Geofabrik). © OpenStreetMap contributors, ODbL 1.0."
          gh release upload $tag work/dist/* --clobber
          mkdir -p receipt && cp work/entry.json receipt/${{ matrix.id }}.entry.json
      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.id }}
          path: receipt/${{ matrix.id }}.entry.json
          retention-days: 3

  catalog:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: receipts
          merge-multiple: true
      - name: Update catalog
        run: sh scripts/publish_catalog.sh receipts "Offline packs $(date -u +%F)"